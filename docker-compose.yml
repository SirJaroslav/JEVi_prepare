services:
  jevi:
    build: .
    container_name: jevi-visual
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
    environment:
      - TZ=UTC
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
