version: '3.8'

services:
  jevi:
    build: .
    container_name: jevi-visual
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - TZ=UTC
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
