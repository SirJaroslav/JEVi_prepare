services:
  jevi:
    build: .
    container_name: ${JEVI_CONTAINER_NAME:-jevi-visual}
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
    environment:
      - TZ=${TZ:-UTC}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    container_name: ${CLOUDFLARED_CONTAINER_NAME:-jevi-cloudflared}
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in Portainer stack env vars}
    restart: unless-stopped
    depends_on:
      jevi:
        condition: service_started
